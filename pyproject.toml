[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm4pathway"
version = "0.1.0"
description = "Deterministic Reactome reaction graphs and maximal simple chains"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
reactome-pipeline = "reactome_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["reactome_pipeline*"]

[tool.setuptools.package-data]
reactome_pipeline = ["config/*.json"]
